name: ci

# Until this existed the repo had only a tag-triggered release, so no workflow
# ran on `pull_request` and Dependabot bumps arrived with nothing to gate a
# merge on.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Deliberately a plain `npm ci` — no --legacy-peer-deps. A bump that only
      # installs by ignoring the peer graph is exactly what this is here to catch.
      - name: Install dependencies
        run: npm ci

      # Before Test and Build, on purpose. `typecheck` builds its own
      # prerequisites via `build:libs`, and that ordering is exactly what used
      # to be broken. Run it after a full `npm run build` and every workspace is
      # already compiled, so the step would pass whether or not `build:libs`
      # still covers what the CLI imports.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

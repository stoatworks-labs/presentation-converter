name: ci

# Until this existed the repo had only a tag-triggered release, so no workflow
# ran on `pull_request` and Dependabot bumps arrived with nothing to gate a
# merge on.
#
# Two scripts are deliberately not steps, both already failing on main:
#
#   npm run typecheck  `build:libs` builds only @presentation-converter/core,
#                      but packages/cli imports @presentation-converter/server —
#                      so tsc stops at TS2307 on a package that was never built.
#                      The build order needs fixing, not the check.
#   npm run lint       eslint is not installed at all: the script exists, the
#                      dependency does not, and it fails with
#                      `sh: eslint: command not found`.
#
# `npm run build` builds every workspace in dependency order and does typecheck
# them, so the compile is still covered.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Deliberately a plain `npm ci` — no --legacy-peer-deps. A bump that only
      # installs by ignoring the peer graph is exactly what this is here to catch.
      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
